name: Sync Multi-Arch Image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (e.g. v1.2, latest)'
        required: true
        default: 'v1.2'
  release:
    types: [published]

jobs:
  sync-to-dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Determine Tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # The release event fires while the multi-arch build in
      # docker-publish.yml is still running (and the tag push already
      # triggered docker-publish directly). Wait for the manifest to land in
      # GHCR instead of racing the build — a tag being present also implies
      # "latest" was pushed, since buildx pushes all tags in one go.
      - name: Wait for image to appear in GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          echo "Waiting for ghcr.io/comicsnow/comics-now:${TAG} ..."
          for i in $(seq 1 60); do
            if skopeo inspect --creds "${GHCR_USER}:${GHCR_TOKEN}" \
                "docker://ghcr.io/comicsnow/comics-now:${TAG}" >/dev/null 2>&1; then
              echo "Image found (attempt ${i})."
              exit 0
            fi
            echo "Attempt ${i}/60: image not in GHCR yet, retrying in 30s..."
            sleep 30
          done
          echo "::error::ghcr.io/comicsnow/comics-now:${TAG} did not appear within 30 minutes."
          exit 1

      - name: Copy Tagged Multi-Arch Image to Docker Hub
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DH_USER: comicsnowdev
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          echo "Syncing tag: ${TAG} to Docker Hub..."
          skopeo copy --all \
            --src-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            --dest-creds "${DH_USER}:${DH_TOKEN}" \
            docker://ghcr.io/comicsnow/comics-now:${TAG} \
            docker://docker.io/${DH_USER}/comics-now:${TAG}

      - name: Copy latest Multi-Arch Image to Docker Hub
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DH_USER: comicsnowdev
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Syncing tag: latest to Docker Hub..."
          skopeo copy --all \
            --src-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            --dest-creds "${DH_USER}:${DH_TOKEN}" \
            docker://ghcr.io/comicsnow/comics-now:latest \
            docker://docker.io/${DH_USER}/comics-now:latest
